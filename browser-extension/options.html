<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="optionsPageTitle">NEXTBookmarks</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        body { width: 640px; padding: 20px; }
        .card h2 {
            font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em;
            color: var(--text-muted); margin: 0 0 12px;
        }
        .card p { margin: 6px 0 0; }
        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            align-items: start;
        }
        .columns .card {
            margin-bottom: 0;
        }
        .columns .right-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
    </style>
</head>
<body>
    <p class="title">NEXTBookmarks</p>

    <div class="columns">
    <section class="card">
        <h2 data-i18n="optionsConnectionHeading"></h2>

        <div class="field">
            <label for="syncMode" data-i18n="optionsSyncModeLabel"></label>
            <select id="syncMode">
                <option value="rest" data-i18n="optionsSyncModeRest"></option>
                <option value="webdav" data-i18n="optionsSyncModeWebdav"></option>
            </select>
            <p id="syncModeHint" class="hint" data-i18n="optionsSyncModeWebdavHint"></p>
        </div>

        <div class="field">
            <label for="serverUrl" data-i18n="optionsServerUrlLabel"></label>
            <input id="serverUrl" placeholder="https://meine-cloud.example.com">
        </div>

        <div class="field">
            <label for="username" data-i18n="optionsUsernameLabel"></label>
            <input id="username">
        </div>

        <div class="field">
            <label for="appPassword" data-i18n="optionsAppPasswordLabel"></label>
            <input id="appPassword" type="password">
        </div>

        <div class="field">
            <label for="autoSyncMode" data-i18n="optionsAutoSyncLabel"></label>
            <select id="autoSyncMode">
                <option value="onChange" data-i18n="optionsAutoSyncOnChange"></option>
                <option value="onClose" data-i18n="optionsAutoSyncOnClose"></option>
            </select>
            <p class="hint" data-i18n="optionsAutoSyncHint"></p>
        </div>

        <div class="actions">
            <button id="save" class="primary" data-i18n="optionsSaveButton"></button>
            <span id="status" class="status"></span>
        </div>
    </section>

    <div class="right-column">
        <section class="card">
            <h2 data-i18n="optionsImportHeading"></h2>
            <p data-i18n="optionsImportDescription"></p>
            <div class="actions">
                <button id="importSkipped" data-i18n="optionsImportSkippedButton"></button>
                <span id="importStatus" class="status"></span>
            </div>
        </section>

        <section class="card">
            <h2 data-i18n="optionsBackupHeading"></h2>
            <p data-i18n="optionsBackupDescription"></p>
            <div class="actions">
                <button id="exportBackup" data-i18n="optionsBackupButton"></button>
                <button id="importBackup" data-i18n="optionsBackupImportButton"></button>
                <input type="file" id="importBackupFile" accept=".html,.htm" style="display:none">
                <span id="backupStatus" class="status"></span>
            </div>
        </section>

        <button id="closeSettings" class="primary" data-i18n="optionsCloseButton" style="align-self: flex-end;"></button>
    </div>
    </div>

    <script src="browser-polyfill-shim.js"></script>
    <script src="i18n.js"></script>
    <script src="export-backup.js"></script>
    <script src="options.js"></script>
</body>
</html>
