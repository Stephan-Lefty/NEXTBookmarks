<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="onboardingPageTitle">NEXTBookmarks</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        body { max-width: 440px; margin: 40px auto; padding: 0 20px; }
        .card p { margin: 10px 0 0; }
    </style>
</head>
<body>
    <div class="card">
        <p class="title">NEXTBookmarks</p>
        <div class="notice">
            <span class="icon">📥</span>
            <span data-i18n="onboardingHeading"></span>
        </div>

        <div id="stepImport">
            <p data-i18n="onboardingImportFromCloudQuestion"></p>
            <div class="actions">
                <button id="importFromCloudNo" data-i18n="onboardingNoButton"></button>
                <button id="importFromCloudYes" class="primary" data-i18n="onboardingYesButton"></button>
            </div>
        </div>

        <div id="stepUpload" hidden>
            <p data-i18n="onboardingUploadToCloudQuestion"></p>
            <div class="actions">
                <button id="uploadToCloudNo" data-i18n="onboardingNoButton"></button>
                <button id="uploadToCloudYes" class="primary" data-i18n="onboardingYesButton"></button>
            </div>
        </div>

        <p id="status" class="status"></p>
    </div>
    <script src="browser-polyfill-shim.js"></script>
    <script src="i18n.js"></script>
    <script src="onboarding.js"></script>
</body>
</html>
